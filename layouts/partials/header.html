<div class="site-bar">
  <a class="kh-seal site-seal" href="/" aria-label="Ed Leeman: home">家</a>
  <nav class="top-nav" aria-label="Main navigation">
    <ul>
      {{- range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"
          {{- if $.Page.IsMenuCurrent "main" . }} class="active" aria-current="page"
          {{- else if $.Page.HasMenuCurrent "main" . }} class="ancestor"
          {{- end }}>{{ .Name }}</a>
      </li>
      {{- end }}
    </ul>
  </nav>
</div>
